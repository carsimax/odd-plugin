name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (dry build, nothing is published)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      EVENT: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/odd-claude/package-lock.json

      - name: Install dependencies
        working-directory: plugins/odd-claude
        run: npm ci

      - name: Build
        working-directory: plugins/odd-claude
        run: npm run build

      - name: Test
        working-directory: plugins/odd-claude
        run: npm test

      - name: Resolve the version and verify it matches package.json
        id: version
        working-directory: plugins/odd-claude
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if [ "$version" != "$pkg" ]; then
            echo "::error::requested version $version does not match plugins/odd-claude/package.json version $pkg"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the TUI bundle
        run: |
          npm --prefix plugins/odd-claude/tui ci
          npm --prefix plugins/odd-claude/tui run bundle

      - name: Build the release assets
        run: >
          node plugins/odd-claude/scripts/release-payload.mjs
          --version "${{ steps.version.outputs.version }}"
          --out "$RUNNER_TEMP/release"
          --bundle plugins/odd-claude/tui/dist/odd-claude.mjs

      - name: Publish the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          gh release create "v$VERSION"
          "$RUNNER_TEMP/release/odd-claude-payload-$VERSION.tar.gz"
          "$RUNNER_TEMP/release/odd-claude.mjs"
          "$RUNNER_TEMP/release/checksums.txt"
          --repo "$GITHUB_REPOSITORY"
          --title "v$VERSION"
          --generate-notes
